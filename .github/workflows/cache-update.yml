name: Update caches on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-caches:
    name: Update caches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Python dependencies
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Pinned exact: Node 24.17.0 has an http.Agent keep-alive regression
          # (nodejs/node#63989). Fixed in 24.18.0. See fix/node-24-keepalive-firebase-deploy.
          node-version: "24.18.0"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Cache mobile node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-modules-${{ hashFiles('mobile/pnpm-lock.yaml') }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Prime pre-commit cache
        run: uv run pre-commit install-hooks
